name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    # `next build` prerenders pages by fetching from Drupal, so it needs real
    # credentials. Add them as repo secrets; the build is skipped without them.
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      DRUPAL_API_KEY: ${{ secrets.DRUPAL_API_KEY }}
      API_ENVIRONMENT: ${{ secrets.API_ENVIRONMENT }}
      API_BASIC_USER: ${{ secrets.API_BASIC_USER }}
      API_BASIC_PASS: ${{ secrets.API_BASIC_PASS }}
    steps:
      - uses: actions/checkout@v4
        if: env.DRUPAL_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.DRUPAL_API_KEY != ''
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.DRUPAL_API_KEY != ''
      - run: npm run build
        if: env.DRUPAL_API_KEY != ''
      - run: echo "::notice::Build skipped — Drupal secrets not configured"
        if: env.DRUPAL_API_KEY == ''
